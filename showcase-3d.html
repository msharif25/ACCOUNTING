<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>3D Showcase — Refractive Crystal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #05060a; touch-action: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  .ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    font-family: "SF Pro Text", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    color: #eef1f8; pointer-events: none;
    background: linear-gradient(to top, rgba(5,6,10,0.72), rgba(5,6,10,0));
  }
  .title { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; line-height: 1.35; }
  .title small { display: block; font-weight: 400; opacity: 0.6; font-size: 12.5px; margin-top: 2px; }
  .controls { display: flex; gap: 8px; pointer-events: auto; }
  .btn {
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06);
    color: #eef1f8; border-radius: 999px;
    padding: 9px 15px; font-size: 13px; font-weight: 600;
    cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .18s, border-color .18s;
  }
  .btn:active { background: rgba(255,255,255,0.16); }
  .btn.on { border-color: rgba(120,190,255,0.75); color: #bfe0ff; }

  .hint {
    position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; color: rgba(238,241,248,0.55);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 12.5px; letter-spacing: 0.3px; pointer-events: none;
    transition: opacity .6s ease; opacity: 1;
  }
  .hint.hide { opacity: 0; }

  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center; background: #05060a; z-index: 10;
    color: #9fb0c8; font-family: -apple-system, system-ui, sans-serif; font-size: 13px;
    transition: opacity .6s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(159,176,200,0.25); border-top-color: #7fbcff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #err {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: #05060a; z-index: 20;
    color: #ff9a9a; font-family: -apple-system, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="hint" id="hint">Drag to orbit · pinch to zoom</div>

  <div class="ui">
    <div class="title">Refractive Crystal
      <small>PBR transmission · IBL reflections · bloom — WebGL / Three.js</small>
    </div>
    <div class="controls">
      <button class="btn on" id="spinBtn">Auto-spin</button>
      <button class="btn" id="bloomBtn">Bloom</button>
    </div>
  </div>

  <div id="loader"><div class="spinner"></div><div>Building scene…</div></div>
  <div id="err"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/lib/three.module.js",
      "three/addons/": "./vendor/three/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  const appEl = document.getElementById('app');
  const loaderEl = document.getElementById('loader');
  const errEl = document.getElementById('err');

  function fail(msg) {
    errEl.style.display = 'flex';
    errEl.textContent = 'Could not start WebGL: ' + msg;
    loaderEl.classList.add('hide');
  }

  try {
    // ---------- Renderer ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    appEl.appendChild(renderer.domElement);

    // ---------- Scene & camera ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.6, 6.2);

    // ---------- Image-based lighting (reflections + refraction) ----------
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = envTex;

    // ---------- Background gradient dome ----------
    const domeMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: {
        top:    { value: new THREE.Color(0x0b1636) },
        mid:    { value: new THREE.Color(0x070a18) },
        bottom: { value: new THREE.Color(0x020306) },
      },
      vertexShader: `varying vec3 vp; void main(){ vp = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec3 vp; uniform vec3 top; uniform vec3 mid; uniform vec3 bottom;
        void main(){
          float h = normalize(vp).y * 0.5 + 0.5;
          vec3 c = h > 0.5 ? mix(mid, top, (h-0.5)*2.0) : mix(bottom, mid, h*2.0);
          gl_FragColor = vec4(c, 1.0);
        }`
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(40, 32, 32), domeMat));

    // ---------- Hero: refractive gem crystal ----------
    const gemGeo = new THREE.IcosahedronGeometry(1.35, 0); // faceted like a cut gem
    const gemMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.0,
      roughness: 0.02,
      transmission: 1.0,
      thickness: 1.4,
      ior: 2.33,                 // diamond-ish
      specularIntensity: 1.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03,
      iridescence: 1.0,          // rainbow sheen at grazing angles
      iridescenceIOR: 1.6,
      iridescenceThicknessRange: [120, 480],
      attenuationColor: new THREE.Color(0x8fd6ff),
      attenuationDistance: 2.5,
      envMapIntensity: 1.6,
    });
    const gem = new THREE.Mesh(gemGeo, gemMat);
    scene.add(gem);

    // subtle inner core that glows through the glass
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.55, 1),
      new THREE.MeshBasicMaterial({ color: 0x2b6cff })
    );
    gem.add(core);

    // ---------- Orbiting metallic gems ----------
    const orbiters = new THREE.Group();
    scene.add(orbiters);
    const orbColors = [0xff5d8f, 0x4de1c1, 0xffd15c, 0x8a7dff];
    for (let i = 0; i < 4; i++) {
      const m = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.26, 0),
        new THREE.MeshStandardMaterial({
          color: orbColors[i], metalness: 1.0, roughness: 0.14, envMapIntensity: 1.4
        })
      );
      m.userData.a = (i / 4) * Math.PI * 2;
      m.userData.r = 2.9;
      m.userData.tilt = (i % 2 ? 0.5 : -0.35);
      orbiters.add(m);
    }

    // ---------- Colored dynamic lights (drive bloom highlights) ----------
    const L1 = new THREE.PointLight(0xff3d81, 22, 30); L1.position.set(4, 3, 3); scene.add(L1);
    const L2 = new THREE.PointLight(0x39d0ff, 20, 30); L2.position.set(-4, -1, 2); scene.add(L2);
    const L3 = new THREE.PointLight(0xffd27a, 14, 30); L3.position.set(0, 4, -4); scene.add(L3);
    scene.add(new THREE.AmbientLight(0x223055, 0.4));

    // ---------- Starfield ----------
    const starCount = 1400;
    const starPos = new Float32Array(starCount * 3);
    const starCol = new Float32Array(starCount * 3);
    const tmp = new THREE.Color();
    for (let i = 0; i < starCount; i++) {
      const r = 14 + Math.random() * 22;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      starPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
      starPos[i*3+1] = r * Math.cos(ph);
      starPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
      tmp.setHSL(0.55 + Math.random() * 0.12, 0.5, 0.6 + Math.random() * 0.35);
      starCol[i*3] = tmp.r; starCol[i*3+1] = tmp.g; starCol[i*3+2] = tmp.b;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      size: 0.09, sizeAttenuation: true, vertexColors: true,
      transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    scene.add(stars);

    // ---------- Controls ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3.2;
    controls.maxDistance = 11;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.9;
    controls.enablePan = false;
    controls.target.set(0, 0, 0);

    // ---------- Post-processing (bloom) ----------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.45,   // strength
      0.62,   // radius
      0.94    // threshold
    );
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // ---------- UI ----------
    const spinBtn = document.getElementById('spinBtn');
    const bloomBtn = document.getElementById('bloomBtn');
    let bloomOn = true;
    spinBtn.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      spinBtn.classList.toggle('on', controls.autoRotate);
    });
    bloomBtn.classList.add('on');
    bloomBtn.addEventListener('click', () => {
      bloomOn = !bloomOn;
      bloom.enabled = bloomOn;
      bloomBtn.classList.toggle('on', bloomOn);
    });

    const hint = document.getElementById('hint');
    let hinted = false;
    const hideHint = () => { if (!hinted) { hinted = true; hint.classList.add('hide'); } };
    renderer.domElement.addEventListener('pointerdown', hideHint, { once: true });
    setTimeout(hideHint, 4200);

    // ---------- Resize ----------
    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }
    window.addEventListener('resize', onResize);

    // ---------- Animate ----------
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      gem.rotation.y += 0.0016;
      gem.rotation.x = Math.sin(t * 0.35) * 0.18;
      core.rotation.y -= 0.01; core.rotation.x += 0.006;
      gem.position.y = Math.sin(t * 0.9) * 0.08;

      orbiters.children.forEach((m) => {
        const a = m.userData.a + t * 0.55;
        m.position.set(
          Math.cos(a) * m.userData.r,
          Math.sin(a * 1.3 + m.userData.tilt) * 0.9,
          Math.sin(a) * m.userData.r
        );
        m.rotation.x += 0.02; m.rotation.y += 0.015;
      });

      L1.position.set(Math.cos(t * 0.7) * 5, Math.sin(t * 0.5) * 3 + 1, Math.sin(t * 0.7) * 5);
      L2.position.set(Math.cos(t * 0.9 + 2) * 4.5, Math.cos(t * 0.6) * 2, Math.sin(t * 0.9 + 2) * 4.5);

      stars.rotation.y = t * 0.01;
      controls.update();
      composer.render();
    }
    animate();

    // reveal
    requestAnimationFrame(() => setTimeout(() => loaderEl.classList.add('hide'), 250));

    // expose for headless verification
    window.__scene = { renderer, scene, camera, composer };
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
    console.error(e);
  }
  </script>
</body>
</html>
